# AUREUS PostgreSQL 18 production profile
# Include from postgresql.conf after validating paths for the target environment.

wal_level = replica
archive_mode = on
archive_command = 'test ! -f /var/lib/postgresql/wal-archive/%f && cp %p /var/lib/postgresql/wal-archive/%f'
archive_timeout = '60s'
wal_compression = on
wal_log_hints = on
max_wal_senders = 10
max_replication_slots = 10
hot_standby = on

# Durability: fail closed rather than trading persistence for throughput.
fsync = on
synchronous_commit = on
full_page_writes = on

# Operational observability.
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on
log_min_duration_statement = 1000
track_io_timing = on

# Safety defaults. Override only through reviewed infrastructure configuration.
password_encryption = 'scram-sha-256'
ssl_min_protocol_version = 'TLSv1.2'
