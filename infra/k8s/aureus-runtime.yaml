apiVersion: v1
kind: Namespace
metadata:
  name: aureus
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aureus-runtime
  namespace: aureus
automountServiceAccountToken: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aureus-runtime
  namespace: aureus
spec:
  replicas: 1
  selector:
    matchLabels: {app: aureus-runtime}
  template:
    metadata:
      labels: {app: aureus-runtime}
    spec:
      serviceAccountName: aureus-runtime
      containers:
        - name: runtime
          image: ghcr.io/OWNER/aureus-2026@sha256:REPLACE_WITH_SIGNED_DIGEST
          ports: [{containerPort: 8000}]
          env:
            - {name: AUREUS_DATABASE_URL_FILE, value: /run/secrets/database_url}
            - {name: AUREUS_VAST_API_KEY_FILE, value: /run/secrets/vast_api_key}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: {drop: ["ALL"]}
          readinessProbe:
            httpGet: {path: /health/ready, port: 8000}
            periodSeconds: 15
          livenessProbe:
            httpGet: {path: /health/live, port: 8000}
            periodSeconds: 30
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
