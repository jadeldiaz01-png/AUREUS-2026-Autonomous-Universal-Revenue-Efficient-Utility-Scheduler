[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "aureus-2026"
version = "0.1.0"
description = "Autonomous Universal Revenue & Efficient Utility Scheduler"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "psycopg[binary]>=3.2,<4",
  "opentelemetry-api>=1.36,<2",
  "opentelemetry-sdk>=1.36,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.36,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9", "pytest-cov>=6.2,<7", "ruff>=0.12,<1", "mypy>=1.17,<2"]

[project.scripts]
aureus = "aureus.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aureus"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = ["FURB157", "UP017", "UP037", "I001"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["aureus"]
