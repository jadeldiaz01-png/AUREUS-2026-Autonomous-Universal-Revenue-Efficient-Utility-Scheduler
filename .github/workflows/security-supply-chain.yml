name: security-supply-chain

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  supply-chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]' pip-audit==2.10.0
      - run: pip-audit
      - name: Reject committed secret material
        shell: bash
        run: |
          set -euo pipefail
          ! find . -type f \( -name '*.pem' -o -name '*.key' -o -name '.env' \) -print -quit | grep -q .
          ! grep -R --line-number -E '(sk_live_|ghp_|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY)' src config infra docs tests 2>/dev/null
